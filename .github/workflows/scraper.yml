name: Hourly LinkedIn Job Alert

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically at minute 0 of every hour
  workflow_dispatch:     # Enables the "Run workflow" manual button in GitHub

permissions:
  contents: write        # Gives GitHub permission to commit and save seen_jobs.txt

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      # --- DEBUG STEP ---
      - name: Debug - List All Files
        run: |
          echo "=== Current Directory ==="
          pwd
          echo "=== Directory Contents (Recursive) ==="
          ls -R

      - name: Run Job Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python app.py

      - name: Save memory (seen jobs)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_jobs.txt
          git commit -m "Updated seen jobs memory" || echo "No new jobs to save"
          git push
